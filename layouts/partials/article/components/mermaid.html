{{ $mermaidConfig := index .Site.Data.external "Mermaid" }}
{{ $mermaidSrc := "" }}
{{ range $mermaidConfig }}
{{ if eq .type "script" }}
{{ $mermaidSrc = .src }}
{{ end }}
{{ end }}

<script src="{{ $mermaidSrc }}"></script>
{{ $mermaid := resources.Get "ts/mermaid.ts" | js.Build (dict "format" "iife" "minify" true) | fingerprint }}
<script src="{{ $mermaid.RelPermalink }}" integrity="{{ $mermaid.Data.Integrity }}"></script>
<style>
    /* Style adjustments for mermaid diagrams */
    .article-content {
        pre.mermaid {
            background-color: transparent;
            padding: 0;
            overflow: visible;
        }
    }

    /* Centre mermaid diagrams */
    .mermaid svg {
        display: block;
        margin: 0 auto;
    }
</style>

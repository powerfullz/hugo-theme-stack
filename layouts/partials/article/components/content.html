<section class="article-content">
    <!-- Refer to https://discourse.gohugo.io/t/responsive-tables-in-markdown/10639/5 -->
    {{ $wrappedTable := printf "<div class=\"table-wrapper\">${1}</div>" }}
    {{ .Content | replaceRE "(<table>(?:.|\n)+?</table>)" $wrappedTable | safeHTML }}
    {{ if or .Params.mermaid (.Page.Store.Get "hasMermaid") }}
    <script type="module">
        import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.esm.min.mjs';
        
        document.querySelectorAll('.mermaid').forEach(el => {
            if (!el.dataset.mermaidSrc) {
                el.dataset.mermaidSrc = el.textContent;
                el.innerHTML = '';
            }
        });

        const renderMermaid = async () => {
            const theme = document.documentElement.dataset.scheme === 'dark' ? 'dark' : 'default';

            mermaid.initialize({
                theme,
                startOnLoad: false,
                fontFamily: '"Google Sans Code", "JetBrains Mono", "Noto Sans SC", monospace'
            });

            const elements = document.querySelectorAll('.mermaid');

            for (const el of elements) {
                const code = el.dataset.mermaidSrc;
                if (!code) continue;

                const id = 'mermaid-' + Math.random().toString(36).substr(2, 9);

                try {
                    // 使用 render 异步生成 SVG，避免阻塞 UI，且不会闪烁
                    const { svg } = await mermaid.render(id, code);
                    el.innerHTML = svg;
                } catch (error) {
                    console.error('Mermaid rendering failed:', error);
                }
            }
        };

        window.addEventListener('onColorSchemeChange', renderMermaid);

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', renderMermaid);
        } else {
            renderMermaid();
        }
    </script>
    {{ end }}
</section>

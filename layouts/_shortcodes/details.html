{{- .Page.Store.Set "hasDetails" true -}}
{{- $title := .Get "title" | default (.Get 0) -}}
{{- $open := .Get "open" | default false -}}
<details class="stack-details"{{ if $open }} open{{ end }}>
    <summary>
        {{- partial "helper/icon" "chevron-right" -}}
        <span>{{ $title | markdownify }}</span>
    </summary>
    <div class="stack-details__content">
        {{ .Inner | markdownify }}
    </div>
</details>
